<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Confirm appointments · JNH Masonry</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .confirm-shell { max-width: 560px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .confirm-hero {
      text-align: center; padding: 1.15rem 1rem; margin-bottom: 1rem;
      border: 1px solid var(--border-gold); border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(93,156,240,.12), transparent 55%), var(--bg-card);
    }
    .confirm-hero img { width: 64px; height: auto; border-radius: 12px; }
    .confirm-hero h1 { margin: .5rem 0 .25rem; color: var(--gold); font-size: 1.25rem; }
    .ap-card {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-card); padding: 1rem; margin-bottom: .75rem;
    }
    .ap-card h3 { margin: 0 0 .35rem; color: var(--gold); font-size: 1.05rem; }
    .ap-card .when { font-weight: 700; color: var(--text); margin-bottom: .35rem; }
    .ap-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .85rem; }
    .ap-actions .btn { flex: 1 1 140px; min-height: 44px; justify-content: center; }
    .token-box { margin-bottom: 1rem; }
    .banner {
      padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem;
      border: 1px solid var(--border); background: var(--bg-elev); font-size: .9rem;
    }
    .banner.warn { border-color: var(--border-gold); color: var(--gold); }
    .banner.err { border-color: #6a3030; color: var(--danger); }
    .banner.ok { border-color: #2f6b45; color: var(--ok); }
  </style>
</head>
<body>
  <div class="confirm-shell">
    <header class="confirm-hero">
      <img src="jnh-logo-official-cinematic.png" width="64" height="64" alt="JNH Masonry" />
      <h1>Pending appointments</h1>
      <p class="muted" style="margin:0">Tap Confirm to put it on your calendar · Decline frees the slot</p>
    </header>

    <div id="banner" class="banner warn hidden"></div>

    <div class="card token-box" id="token-panel">
      <label>Admin token
        <input type="password" id="admin-token" placeholder="Paste ADMIN_TOKEN" autocomplete="off" />
      </label>
      <p class="muted" style="margin:.5rem 0 0;font-size:.8rem">Bookmark this page with <code>?token=…</code> on your phone so you don’t re-type it. Same value as the Worker secret.</p>
      <div class="actions" style="margin-top:.75rem">
        <button type="button" class="btn primary" id="btn-load">Load pending</button>
      </div>
    </div>

    <div id="list"></div>
    <p id="empty" class="empty-state hidden">No pending requests. You’re clear.</p>
    <p class="muted" style="text-align:center;margin-top:1.5rem;font-size:.8rem">
      <a href="index.html" style="color:var(--gold)">Open Pro Desk</a> ·
      <a href="book.html" style="color:var(--gold)">Public booker</a>
    </p>
  </div>

  <script src="booking-config.js"></script>
  <script src="booking-store.js"></script>
  <script src="booking-api.js"></script>
  <script>
  (function () {
    "use strict";
    var params = new URLSearchParams(location.search);
    var tokenInput = document.getElementById("admin-token");
    var banner = document.getElementById("banner");
    var listEl = document.getElementById("list");
    var emptyEl = document.getElementById("empty");

    if (params.get("token")) {
      tokenInput.value = params.get("token");
      document.getElementById("token-panel").classList.add("hidden");
    }

    function showBanner(msg, kind) {
      banner.textContent = msg;
      banner.className = "banner " + (kind || "warn");
      banner.classList.remove("hidden");
    }

    function token() { return (tokenInput.value || "").trim(); }

    function formatWhen(a) {
      var B = window.JNHBooking;
      var d = new Date(a.date + "T12:00:00");
      var label = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      var t = B ? B.formatTimeLabel(a.time) : a.time;
      return label + " · " + t + " ET";
    }

    function renderLocal() {
      var B = window.JNHBooking;
      if (!B) return [];
      return B.getAppointments().filter(function (a) {
        return a.status === "pending" || a.status === "booked";
      });
    }

    async function load() {
      listEl.innerHTML = "";
      emptyEl.classList.add("hidden");
      var items = [];
      try {
        if (window.JNHBookingAPI && window.JNHBookingAPI.apiEnabled()) {
          if (!token()) { showBanner("Enter admin token to load Google Calendar pending holds.", "warn"); return; }
          var data = await window.JNHBookingAPI.fetchPending(token());
          items = (data && data.appointments) || [];
          showBanner("Live from Google Calendar (pending holds).", "ok");
        } else {
          items = renderLocal();
          showBanner("API not configured yet — showing local Pro Desk pending/booked on this device. Deploy Worker + set booking-config.js mode to \"api\".", "warn");
        }
      } catch (err) {
        showBanner(String(err.message || err), "err");
        items = renderLocal();
      }

      if (!items.length) {
        emptyEl.classList.remove("hidden");
        return;
      }

      items.forEach(function (a) {
        var card = document.createElement("div");
        card.className = "ap-card";
        card.innerHTML =
          '<div class="when">' + escapeHtml(formatWhen(a)) + '</div>' +
          '<h3>' + escapeHtml(a.name || "Customer") + '</h3>' +
          '<div class="muted">' +
            (a.phone ? '<a href="tel:' + escapeHtml(a.phone) + '">' + escapeHtml(a.phone) + '</a><br>' : '') +
            escapeHtml(a.address || "") +
            (a.notes ? '<br>' + escapeHtml(String(a.notes).split("\n")[0]) : '') +
          '</div>' +
          '<div class="ap-actions">' +
            '<button type="button" class="btn primary" data-act="confirm">Confirm</button>' +
            '<button type="button" class="btn danger" data-act="decline">Decline</button>' +
            (a.phone ? '<a class="btn ghost" href="tel:' + escapeHtml(a.phone) + '">Call</a>' : '') +
          '</div>';
        card.querySelector('[data-act="confirm"]').addEventListener("click", function () { act("confirm", a); });
        card.querySelector('[data-act="decline"]').addEventListener("click", function () { act("decline", a); });
        listEl.appendChild(card);
      });
    }

    async function act(kind, a) {
      try {
        if (window.JNHBookingAPI && window.JNHBookingAPI.apiEnabled()) {
          if (!token()) { showBanner("Admin token required.", "err"); return; }
          if (kind === "confirm") await window.JNHBookingAPI.confirmBooking(a.id, token());
          else await window.JNHBookingAPI.declineBooking(a.id, token());
        } else if (window.JNHBooking) {
          window.JNHBooking.updateAppointment(a.id, { status: kind === "confirm" ? "confirmed" : "cancelled" });
        }
        showBanner(kind === "confirm" ? "Confirmed." : "Declined — slot freed.", "ok");
        await load();
      } catch (err) {
        showBanner(String(err.message || err), "err");
      }
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.getElementById("btn-load").addEventListener("click", load);
    load();
  })();
  </script>
</body>
</html>
